services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: legal-ai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-legal_ai}
      POSTGRES_USER: ${POSTGRES_USER:-legal_ai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-legal_ai_dev}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - legal_ai_postgres_data:/var/lib/postgresql/data
      # Runs once, on an empty data directory, before the server accepts
      # connections. An existing volume is left alone -- to re-run this,
      # remove the volume.
      - ./src/api/databases:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-legal_ai} -d ${POSTGRES_DB:-legal_ai}"]
      interval: 5s
      timeout: 5s
      retries: 10

  neo4j:
    image: neo4j:5
    container_name: legal-ai-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-legal_ai_dev}
    ports:
      - "${NEO4J_HTTP_PORT:-7475}:7474"
      - "${NEO4J_BOLT_PORT:-7688}:7687"
    volumes:
      - legal_ai_neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      target: api
    container_name: legal-ai-api
    restart: unless-stopped
    environment:
      # Inside the compose network the stores answer on their own names and
      # their internal ports, not the host ports mapped above.
      DATABASE_URL: postgresql://${POSTGRES_USER:-legal_ai}:${POSTGRES_PASSWORD:-legal_ai_dev}@postgres:5432/${POSTGRES_DB:-legal_ai}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-legal_ai_dev}
      # No default. An unset secret rejects every authenticated request,
      # which is the safe failure; a default here would ship a signing key
      # that every deployment shares.
      LEGAL_AI_JWT_SECRET: ${LEGAL_AI_JWT_SECRET}
      LEGAL_AI_JWT_EXPIRES_IN: ${LEGAL_AI_JWT_EXPIRES_IN:-86400}
      # No default. A wildcard would let any site the user visits make
      # authenticated calls; unset simply means no browser may call it.
      LEGAL_AI_CORS_ORIGINS: ${LEGAL_AI_CORS_ORIGINS:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      LEGAL_AI_VERIFICATION_LEVEL: ${LEGAL_AI_VERIFICATION_LEVEL:-quick}
      # /search embeds and reranks too, so the API uses the same servers.
      LEGAL_AI_EMBED_URL: ${LEGAL_AI_EMBED_URL-http://embedder:80}
      LEGAL_AI_RERANK_URL: ${LEGAL_AI_RERANK_URL-http://reranker:80}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      # Embedder and cross-encoder weights, ~1GB. Without this every restart
      # re-downloads them.
      - legal_ai_models:/models
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      embedder:
        condition: service_healthy
      reranker:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      # The first request loads the models, which takes far longer than a
      # steady-state one.
      start_period: 120s

  # The two models, loaded once and served over HTTP.
  #
  # Text Embeddings Inference, not Text Generation Inference: generation
  # already goes to Gemini over HTTP, so there is no local LLM to serve.
  # One model per container, hence two of them.
  #
  # What this buys is measured: a worker that loads these itself is 1453 MB
  # resident, of which 1290 MB is the model stack. Calling them instead
  # makes a worker 163 MB, so a second worker costs 163 MB rather than
  # 1.45 GB -- and one GPU serves every worker instead of one each.
  #
  # For a GPU box, swap the image for the CUDA tag and add the device:
  #   image: ghcr.io/huggingface/text-embeddings-inference:1.8
  #   deploy: {resources: {reservations: {devices: [{capabilities: [gpu]}]}}}
  # Measured on an RTX 3050: reranking 50 passages, 5.12s CPU -> 0.61s GPU,
  # with an identical ranking.
  embedder:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.8
    restart: unless-stopped
    # all-mpnet-base-v2 and nothing else: every vector in the corpus came
    # from it, so another model means re-embedding 35,601 sections and
    # 332,025 chunks before search works at all.
    # Buffers sized to what the client actually sends. TEI defaults to
    # 16384 batch tokens and 512 concurrent requests, and pre-allocates for
    # them: 2.11 GB against 1.17 GB here, for identical vectors.
    command:
      - "--model-id=sentence-transformers/all-mpnet-base-v2"
      - "--max-batch-tokens=8192"
      - "--max-concurrent-requests=16"
      - "--max-client-batch-size=32"
    ports:
      - "${EMBED_PORT:-8085}:80"
    volumes:
      - legal_ai_models:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:80/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      # First start downloads the weights into the volume.
      start_period: 300s

  reranker:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.8
    restart: unless-stopped
    command:
      - "--model-id=cross-encoder/ms-marco-MiniLM-L-12-v2"
      - "--max-batch-tokens=8192"
      - "--max-concurrent-requests=16"
      - "--max-client-batch-size=32"
    ports:
      - "${RERANK_PORT:-8086}:80"
    volumes:
      - legal_ai_models:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:80/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 300s

  # Answers the questions the API queues. One is the right number today:
  # `--scale worker=N` works and the queue needs no coordination for it, but
  # every worker shares one model key, and three of them spent 45 minutes
  # rate-limiting each other. Raise the key's quota before the count.
  #
  # It can equally run on another machine -- it needs these connections and
  # no inbound port.
  worker:
    build:
      context: .
      target: worker
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-legal_ai}:${POSTGRES_PASSWORD:-legal_ai_dev}@postgres:5432/${POSTGRES_DB:-legal_ai}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-legal_ai_dev}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      LEGAL_AI_VERIFICATION_LEVEL: ${LEGAL_AI_VERIFICATION_LEVEL:-quick}
      LEGAL_AI_RESEARCH_TIMEOUT: ${LEGAL_AI_RESEARCH_TIMEOUT:-300}
      # Unset these and the worker loads the models itself instead, which
      # works and costs 1.29 GB more per worker.
      LEGAL_AI_EMBED_URL: ${LEGAL_AI_EMBED_URL-http://embedder:80}
      LEGAL_AI_RERANK_URL: ${LEGAL_AI_RERANK_URL-http://reranker:80}
    volumes:
      - legal_ai_models:/models
    # SIGTERM asks the worker to finish the job in hand rather than leave a
    # row saying "running" with nothing behind it. Longer than the run's own
    # ceiling (LEGAL_AI_RESEARCH_TIMEOUT, 300s) plus a margin, because a
    # grace period shorter than that ends in the SIGKILL it exists to avoid
    # -- and a turn waiting out model rate-limit backoff is exactly the one
    # that would hit it.
    stop_grace_period: 330s
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      embedder:
        condition: service_healthy
      reranker:
        condition: service_healthy

volumes:
  legal_ai_postgres_data:
  legal_ai_neo4j_data:
  legal_ai_models:
