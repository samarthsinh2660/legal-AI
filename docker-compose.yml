services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: legal-ai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-legal_ai}
      POSTGRES_USER: ${POSTGRES_USER:-legal_ai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-legal_ai_dev}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - legal_ai_postgres_data:/var/lib/postgresql/data
      # Runs once, on an empty data directory, before the server accepts
      # connections. An existing volume is left alone -- to re-run this,
      # remove the volume.
      - ./src/api/databases:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-legal_ai} -d ${POSTGRES_DB:-legal_ai}"]
      interval: 5s
      timeout: 5s
      retries: 10

  neo4j:
    image: neo4j:5
    container_name: legal-ai-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-legal_ai_dev}
    ports:
      - "${NEO4J_HTTP_PORT:-7475}:7474"
      - "${NEO4J_BOLT_PORT:-7688}:7687"
    volumes:
      - legal_ai_neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: legal-ai-api
    restart: unless-stopped
    environment:
      # Inside the compose network the stores answer on their own names and
      # their internal ports, not the host ports mapped above.
      DATABASE_URL: postgresql://${POSTGRES_USER:-legal_ai}:${POSTGRES_PASSWORD:-legal_ai_dev}@postgres:5432/${POSTGRES_DB:-legal_ai}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-legal_ai_dev}
      # No default. An unset secret rejects every authenticated request,
      # which is the safe failure; a default here would ship a signing key
      # that every deployment shares.
      LEGAL_AI_JWT_SECRET: ${LEGAL_AI_JWT_SECRET}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      LEGAL_AI_VERIFICATION_LEVEL: ${LEGAL_AI_VERIFICATION_LEVEL:-quick}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      # Embedder and cross-encoder weights, ~1GB. Without this every restart
      # re-downloads them.
      - legal_ai_models:/models
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      # The first request loads the models, which takes far longer than a
      # steady-state one.
      start_period: 120s

volumes:
  legal_ai_postgres_data:
  legal_ai_neo4j_data:
  legal_ai_models:
