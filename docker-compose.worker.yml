# The worker and both model servers, for a machine that holds no database.
#
#   docker compose -f docker-compose.worker.yml up -d --build
#
# Postgres and Neo4j stay on the main server, reached through the `tunnel`
# service below. The worker opens connections and accepts none, so nothing
# here needs a port open to the internet.
#
# The model servers are CPU images. TEI's CUDA images start at Turing, so a
# GTX 1070 cannot run them; a GPU would have to be used by dropping these
# and letting the worker load the models itself (LEGAL_AI_EMBED_URL unset,
# torch built against cu126).
services:
  embedder:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.8
    restart: unless-stopped
    command:
      - "--model-id=sentence-transformers/all-mpnet-base-v2"
      - "--max-batch-tokens=8192"
      - "--max-concurrent-requests=16"
      - "--max-client-batch-size=32"
    volumes:
      - legal_ai_models:/data
    # deploy: {resources: {reservations: {devices: [{capabilities: [gpu]}]}}}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:80/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 300s

  reranker:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.8
    restart: unless-stopped
    command:
      - "--model-id=cross-encoder/ms-marco-MiniLM-L-12-v2"
      - "--max-batch-tokens=8192"
      - "--max-concurrent-requests=16"
      - "--max-client-batch-size=32"
    volumes:
      - legal_ai_models:/data
    # deploy: {resources: {reservations: {devices: [{capabilities: [gpu]}]}}}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:80/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 300s

  # Postgres and Neo4j reached over SSH rather than over the internet.
  # Neither port is open on the main server -- only 22 is -- and Postgres
  # and Bolt send credentials in the clear, so SSH is what encrypts them.
  # The worker connects to `tunnel:5433` and `tunnel:7688`, which are this
  # container's ports on the compose network, forwarded to the main
  # server's own localhost.
  tunnel:
    image: alpine:3.22
    restart: unless-stopped
    command: >
      sh -c "apk add --no-cache autossh >/dev/null &&
      exec autossh -M 0 -N
      -o StrictHostKeyChecking=accept-new -o ExitOnForwardFailure=yes
      -o ServerAliveInterval=30 -o ServerAliveCountMax=3
      -L 0.0.0.0:5433:localhost:${POSTGRES_PORT:-5433}
      -L 0.0.0.0:7688:localhost:${NEO4J_BOLT_PORT:-7688}
      -i /key ${SSH_USER}@${DB_HOST}"
    volumes:
      - ${SSH_KEY}:/key:ro
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 5433 && nc -z localhost 7688"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  worker:
    build:
      context: .
      target: worker
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@tunnel:5433/${POSTGRES_DB:-legal_ai}
      NEO4J_URI: bolt://tunnel:7688
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      LEGAL_AI_VERIFICATION_LEVEL: ${LEGAL_AI_VERIFICATION_LEVEL:-quick}
      LEGAL_AI_RESEARCH_TIMEOUT: ${LEGAL_AI_RESEARCH_TIMEOUT:-300}
      LEGAL_AI_EMBED_URL: http://embedder:80
      LEGAL_AI_RERANK_URL: http://reranker:80
    volumes:
      - legal_ai_models:/models
    stop_grace_period: 330s
    depends_on:
      tunnel:
        condition: service_healthy
      embedder:
        condition: service_healthy
      reranker:
        condition: service_healthy

volumes:
  legal_ai_models:
