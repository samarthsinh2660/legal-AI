[project]
name = "legal-ai"
version = "0.0.1"
description = "Pramana AI — Indian Legal Intelligence data layer and recon tooling"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "requests>=2.32",
    "pyarrow>=17.0",
    "pypdf>=4.3",
    "python-docx>=1.1",
    "python-dotenv>=1.0",
    "psycopg[binary]>=3.1",
    "psycopg_pool>=3.2",
    "pgvector>=0.3",
    "sentence-transformers>=3.0",
    "neo4j>=5.20",
    "beautifulsoup4>=4.12",
    "bharat-courts[archive]>=0.3.3",
    "langgraph>=1.2",
    "langchain-core>=1.6",
    "google-genai>=1.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "pyjwt>=2.9",
    "argon2-cffi>=23.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "responses>=0.25",
    "httpx>=0.27",
    "pytest-asyncio>=0.24",
]

scripts = [
    "duckdb>=1.5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The chat controller is async; without this every async test is skipped
# silently, which looks like a passing suite.
asyncio_mode = "auto"
