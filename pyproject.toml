[project]
name = "legal-ai"
version = "0.0.1"
description = "Pramana AI — Indian Legal Intelligence data layer and recon tooling"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "requests>=2.32",
    "pyarrow>=17.0",
    "pypdf>=4.3",
    "python-dotenv>=1.0",
    "psycopg[binary]>=3.1",
    "pgvector>=0.3",
    "sentence-transformers>=3.0",
    "neo4j>=5.20",
    "beautifulsoup4>=4.12",
    "bharat-courts[archive]>=0.3.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "responses>=0.25",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
